[metadata]
name = django-timescaledb-ng
version = 0.4.0
description = A Django database backend for integration with TimescaleDB (maintained fork of django-timescaledb)
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/ekinertac/django-timescaledb
project_urls =
    Source = https://github.com/ekinertac/django-timescaledb
    Issues = https://github.com/ekinertac/django-timescaledb/issues
    Original project = https://github.com/jamessewell/django-timescaledb
author = Rasmus Schlünsen
author_email = raller84@gmail.com
maintainer = ekinertac
license = Apache-2.0
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Framework :: Django :: 5.0
    Framework :: Django :: 5.1
    Framework :: Django :: 5.2
    Framework :: Django :: 6.0
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = true
packages = find:

[options.packages.find]
exclude =
    timescale.tests
    timescale.tests.*
